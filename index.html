          { label: 'Да, оформляется доверенность', value: 'yes', result: 'build_cert' }
        ]
      }
    };

    const ALWAYS_CHECK = 'у всех участников сделки номера телефонов и email должны отличаться (кроме детей до 14 лет — указывается номер родителя/опекуна). При семейной ипотеке свидетельство о рождении ребёнка обязательно!';

    let history = [];
    let answers = {};

    function getAnswer(qId) {
      return answers[qId] ? answers[qId].value : null;
    }

    function renderQuestion(qId) {
      const q = QUESTIONS[qId];
      const app = document.getElementById('app');
      renderBreadcrumbs();

      let backBtn = history.length > 0
        ? '<button class="back-btn" onclick="goBack()">← Назад к предыдущему шагу</button>'
        : '';

      const optionsHtml = q.options.map((opt, idx) => {
        const descHtml = opt.desc ? '<div class="option-desc">' + opt.desc + '</div>' : '';
        return '<button class="option-btn" onclick="selectOption(\'' + qId + '\', ' + idx + ')">' +
          '<div><div class="option-title">' + opt.label + '</div>' + descHtml + '</div>' +
          '<div class="arrow">→</div>' +
        '</button>';
      }).join('');

      const subHtml = q.subtitle ? '<p class="subtitle">' + q.subtitle + '</p>' : '';

      app.innerHTML = backBtn +
        '<div class="card">' +
          '<div class="step-badge">Шаг ' + q.step + '</div>' +
          '<h2>' + q.title + '</h2>' +
          subHtml +
          '<div class="options">' + optionsHtml + '</div>' +
        '</div>';
    }

    function selectOption(qId, optIndex) {
      const q = QUESTIONS[qId];
      const opt = q.options[optIndex];

      history.push(qId);
      answers[qId] = opt;

      if (opt.result) {
        renderResult(opt.result);
        return;
      }

      let nextId = opt.next;
      if (opt.nextByPayment) {
        const pay = getAnswer('payment');
        nextId = opt.nextByPayment[pay];
      }

      renderQuestion(nextId);
    }

    function goBack() {
      if (history.length === 0) return;
      const prevQId = history.pop();
      delete answers[prevQId];
      renderQuestion(prevQId);
    }

    function resetQuiz() {
      history = [];
      answers = {};
      renderQuestion('payment');
    }

    function renderBreadcrumbs() {
      const container = document.getElementById('breadcrumbs');
      const keys = Object.keys(answers);
      if (keys.length === 0) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }
      container.classList.remove('hidden');
      container.innerHTML = keys.map(k => '<span class="crumb">' + answers[k].label + '</span>')
        .join('<span class="crumb-sep">•</span>');
    }

    function buildResultData(type) {
      const sections = [];
      const important = [];
      const notes = [];
      const titleBadge = Object.values(answers).map(a => a.label).join(' • ');

      if (type === 'result_llc') {
        sections.push({
          title: 'На организацию',
          items: [
            'Карточка предприятия',
            'Устав организации — 3 стр. (если есть)',
            'Решение об учреждении ООО',
            'Протокол об избрании директора (если в уставе не прописывается директор компании)',
            'Реквизиты счёта возврата (если наличные / рассрочка)'
          ]
        });
        sections.push({
          title: 'На подписанта (если директор)',
          items: ['Паспорт', 'СНИЛС', 'ИНН', 'Эл. почта', 'Номер телефона']
        });
        sections.push({
          title: 'На подписанта (доверенное лицо)',
          items: ['Паспорт', 'СНИЛС', 'ИНН', 'Доверенность + тождественность']
        });
        sections.push({
          title: 'На подписание ДДУ',
          items: [
            'Выписка из ЕГРЮЛ (свежая)',
            'Решение об учреждении ООО (если не было сделок с недвижимостью)'
          ]
        });
        notes.push('подписание документов и направление на регистрацию проводятся только в электронном формате:<br>• Если подписывает генеральный директор — возможно подписание через токен (УКЭП руководителя).<br>• Если подписывает представитель по доверенности — помимо УКЭП представителя, необходимо приложить машиночитаемую доверенность (МЧД).');
        return { titleBadge, sections, important, notes };
      }

      if (type === 'result_ip') {
        sections.push({
          title: 'Документы для ДДУ',
          items: ['ИНН', 'ОГРН (ОГРНИП)', 'Паспорт', 'Номер телефона, электронная почта', 'Реквизиты счёта (ЕГРИП)', 'СНИЛС']
        });
        sections.push({
          title: 'На подписание',
          items: ['Паспорт, СНИЛС, ИНН', 'Нотариальное согласие супруга (если состоит в браке)']
        });
        return { titleBadge, sections, important, notes };
      }

      if (type === 'build_foreign') {
        const pay = getAnswer('payment');
        const poa = getAnswer('foreign_poa') === 'yes';
        const dduDocs = [
          'Паспорт',
          'Перевод паспорта (или вид на жительство — кроме Казахстана и Белоруссии)',
          'Документ, подтверющий право пребывания (патент, миграционная карта и т.д.)'
        ];
        if (pay === 'mortgage') {
          dduDocs.push('Свидетельство о праве нахождения в РФ', 'СНИЛС', 'ИНН');
        } else {
          dduDocs.push('СНИЛС и ИНН — при наличии в РФ');
        }
        sections.push({ title: 'Документы для ДДУ', items: dduDocs });
        sections.push({
          title: 'На подписание',
          items: ['Паспорт', 'Перевод паспорта', 'Документ, подтверждающий право пребывания']
        });
        if (poa) {
          sections.push({
            title: 'На доверенное лицо',
            items: [
              'Номер телефона, электронная почта',
              'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением',
              'СНИЛС, ИНН',
              'Оригинал доверенности + тождественность (обязательно)'
            ]
          });
          important.push('К доверенности обязательно прилагается тождественность.');
        }
        important.push('Если есть российский номер телефона, СНИЛС и ИНН — нужна электронная регистрация. Иначе — бумажная регистрация и нотариальное согласие/перевод в РФ.');
        return { titleBadge, sections, important, notes };
      }

      if (type === 'build_military') {
        const method = getAnswer('military_method');
        const married = getAnswer('military_marital') === 'married';
        const poa = getAnswer('military_poa') === 'yes';
        const dduDocs = [
          'Номер телефона, электронная почта',
          'Паспорт — все страницы (включая пустые)',
          'СНИЛС, ИНН',
          'Сертификат НИС'
        ];
        if (married) {
          dduDocs.push('Свидетельство о браке', 'Нотариальное согласие супруга/супруги');
        }
        sections.push({ title: 'Документы для ДДУ', items: dduDocs });
        if (method !== 'cash_nis') {
          sections.push({
            title: 'Дополнительно при семейной ипотеке',
            items: [
              'Свидетельство о рождении ребёнка',
              'Справка по форме №18 и №19 (со штампом о входе в ЦЖЗ и Росвоенипотеку)',
              'СНИЛС ребёнка',
              'Адресная справка по форме 11/10 (опционально, в зависимости от банка)'
            ]
          });
        }
        if (poa) {
          sections.push({
            title: 'На доверенное лицо',
            items: [
              'Номер телефона, электронная почта',
              'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением',
              'СНИЛС, ИНН',
              'Оригинал доверенности',
              'Тождественность к доверенности (обязательно)'
            ]
          });
          important.push('К доверенности обязательно прилагается тождественность.');
        }
        sections.push({
          title: 'В случае сделки с Росвоенипотекой (документы должны быть заверены кредитором)',
          items: [
            'Договор целевого жилищного займа (ЦЖЗ)',
            'Копия Договора участия в долевом строительстве',
            'Договор банковского счета',
            'Копия кредитного договора',
            'Копия паспорта гражданина РФ',
            'Оригинал уведомления заемщика – участника НИС об ознакомлении с условиями приобретения объекта недвижимости у застройщика и рисках, связанных с приобретением жилья в объекте незавершенного строительства',
            'Копия договора залогового счета, на который будет осуществляться возврат средств со счета эскроу',
            'Договор залога прав по договору залогового счета'
          ]
        });
        return { titleBadge, sections, important, notes };
      }

      if (type === 'build_cert') {
        const married = getAnswer('cert_marital') === 'married';
        const poa = getAnswer('cert_poa') === 'yes';
        const dduDocs = [
          'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением, разворот 18–19 стр.',
          'СНИЛС, ИНН',
          'Сам сертификат',
          'Уведомление (памятка) об условиях сертификата'
        ];
        if (married) {
          dduDocs.push('Свидетельство о заключении брака (от каждого участника)');
        }
        sections.push({ title: 'Документы для ДДУ', items: dduDocs });
        sections.push({
          title: 'На подписание',
          items: ['Паспорт, СНИЛС, ИНН', 'Номер телефона, электронная почта']
        });
        if (poa) {
          sections.push({
            title: 'На доверенное лицо',
            items: [
              'Номер телефона, электронная почта',
              'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением',
              'СНИЛС, ИНН',
              'Оригинал доверенности + тождественность (обязательно)'
            ]
          });
        }
        important.push('После регистрации для ДУП в фонд: Разрешение на ввод объекта, копия доверенности, копия карточки предприятия.');
        notes.push('Заполнить на всех участников с переводом на ипотеку и одобрением жилья / невозможностью залога. Срок ожидания выплаты: один выдаётся в момент — текущий год. Важно смотреть, на кого выдан сертификат!');
        return { titleBadge, sections, important, notes };
      }

      if (type === 'build_rf') {
        const pay = getAnswer('payment');
        const married = getAnswer('marital') === 'married';
        const part = getAnswer('participants');
        const hasMsk = getAnswer('msk') === 'yes';
        const mType = getAnswer('mortgage_type');
        const poa = getAnswer('poa') === 'yes';

        const passportReq = pay === 'mortgage'
          ? 'Паспорт — все страницы (включая пустые)'
          : 'Паспорт: 1 стр., страница с регистрацией (при отсутствии постоянной — временная прописка), страница с семейным положением, разворот 18–19 стр.';

        if (part === '1') {
          sections.push({
            title: 'Документы для ДДУ',
            items: [
              'Паспорт',
              'Снилс',
              'ИНН',
              'График платежей (в случае рассрочки)'
            ]
          });
        } else if (part === '2_joint') {
          const docs = ['Номер телефона, электронная почта', passportReq, 'СНИЛС, ИНН'];
          if (married) docs.push('Свидетельство о заключении брака');
          sections.push({ title: 'От каждого участника', items: docs });
        } else if (part === 'parents_kids') {
          const pDocs = ['Номер телефона, электронная почта', passportReq, 'СНИЛС, ИНН'];
          if (married) pDocs.push('Свидетельство о заключении брака');
          sections.push({ title: 'На каждого родителя', items: pDocs });
          sections.push({
            title: 'На каждого ребёнка до 14 лет',
            items: [
              'Телефон и email одного из родителей',
              'Свидетельство о рождении',
              'Свидетельство о регистрации по месту жительства / пребывания',
              'СНИЛС ребёнка, ИНН ребёнка'
            ]
          });
        } else if (part === 'shares') {
          sections.push({
            title: 'От каждого участника сделки',
            items: ['Номер телефона, электронная почта', passportReq, 'СНИЛС, ИНН']
          });
          important.push('Важно уточнить, состоит ли кто-то из участников в браке — могут потребоваться дополнительные документы.');
        }

        if (pay === 'mortgage' && mType === 'family') {
          sections.push({
            title: 'Семейная ипотека',
            items: [
              'Свидетельства о рождении всех детей (до 14 лет)',
              'Свидетельства о рождении всех детей + Паспорт (от 14 лет)',
              'СНИЛС всех детей',
              'Прописка детей совместно с родителями не требуется',
              'Свидетельство о заключении брака',
              'Свидетельство о расторжении брака',
              'Супруг автоматически созаемщик',
              'Паспорт все страницы, в т.ч пустые',
              'СНИЛС'
            ]
          });
        }

        if (pay === 'mortgage' && mType === 'standard') {
          sections.push({
            title: 'Стандартная ипотека',
            items: [
              'Паспорт — все страницы, в т.ч. пустые',
              'СНИЛС',
              'Нотариальное согласие супруга/ги + тождественность / либо брачный договор'
            ]
          });
        }

        const signDocs = [];
        if (part === '1') {
          signDocs.push('Паспорт, СНИЛС, ИНН');
          if (married) signDocs.push('Нотариальное согласие супруга/супруги (или брачный договор)');
        } else if (part === '2_joint') {
          signDocs.push(married
            ? 'От каждого участника: Паспорт, СНИЛС, ИНН, свидетельство о заключении брака'
            : 'От каждого участника: Паспорт, СНИЛС, ИНН');
        } else if (part === 'parents_kids') {
          signDocs.push('Паспорт, СНИЛС, ИНН' + (married ? ', свидетельство о браке' : '') + ', свидетельство о рождении ребёнка / СНИЛС ребёнка');
        } else {
          signDocs.push('От каждого участника: Паспорт, СНИЛС, ИНН');
        }
        if (pay === 'mortgage') {
          signDocs.push('Кредитный договор');
        }
        sections.push({ title: 'На подписание', items: signDocs });

        if (hasMsk) {
          sections.push({
            title: 'Материнский капитал',
            items: [
              'Сертификат МСК',
              'Выписка об остатке средств МСК (свежая, не старше 7 дней)'
            ]
          });
          if (pay === 'cash') {
            important.push('Ребёнку должно быть более 3 лет, иначе сделку с МСК нельзя провести (при оплате без ипотеки)!');
          }
          important.push('Сертификат МСК + выписка об остатке средств (свежая, не старше 7 дней) — обязательны при использовании МСК.');
        }

        if (poa) {
          sections.push({
            title: 'На доверенное лицо',
            items: [
              'Номер телефона, электронная почта',
              'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением',
              'СНИЛС, ИНН',
              'Оригинал доверенности',
              'Тождественность к доверенности (обязательно)'
            ]
          });
          important.push('К доверенности обязательно прилагается тождественность.');
        }

        if (pay === 'mortgage' && part === 'parents_kids') {
          important.push('Не все банки работают с долями! Некоторые банки требуют согласие органов опеки.');
        }
        if (pay === 'mortgage' && married && (part === '2_joint' || part === 'parents_kids')) {
          notes.push('С 01.02.2026 в кредитный договор включаются оба супруга.');
        }
        if (part === 'parents_kids') {
          notes.push('На детей выделяются доли (размер сообщают родители). Если ребёнку старше 14 лет — собирается полный пакет документов, указываются его личный номер и email.');
          notes.push('На родителей оформляется совместная собственность.');
        }
        if (hasMsk) {
          notes.push('После регистрации клиенту нужно через Госуслуги или МФЦ/ПФР подать заявление на распоряжение средствами маткапитала.');
        }

        return { titleBadge, sections, important, notes };
      }
    }

    function renderResult(resultType) {
      renderBreadcrumbs();
      const data = buildResultData(resultType);
      const app = document.getElementById('app');

      const sectionsHtml = data.sections.map(sec => {
        const itemsHtml = sec.items.map(item =>
          '<li><span class="check">✓</span><span>' + item + '</span></li>'
        ).join('');
        return '<div class="sec-card"><h3><span class="dot"></span>' + sec.title + '</h3><ul>' + itemsHtml + '</ul></div>';
      }).join('');

      const importantHtml = data.important.map(txt =>
        '<div class="alert-box alert-important"><strong>!</strong><div><strong>Важно:</strong> ' + txt + '</div></div>'
      ).join('');

      const notesHtml = data.notes.map(txt =>
        '<div class="alert-box alert-note"><strong>ℹ</strong><div><strong>Уточнение:</strong> ' + txt + '</div></div>'
      ).join('');

      app.innerHTML =
        '<div class="result-toolbar">' +
          '<button class="back-btn" style="margin-bottom:0" onclick="goBack()">← Назад</button>' +
          '<div class="toolbar-actions">' +
            '<button id="copyBtn" class="btn-primary" onclick="copyChecklist()">Скопировать список</button>' +
            '<button class="btn-secondary" onclick="resetQuiz()">Сначала</button>' +
          '</div>' +
        '</div>' +

        '<div class="grid">' + sectionsHtml + '</div>' +
        importantHtml +
        notesHtml +
        (resultType !== 'result_llc' && resultType !== 'result_ip'
          ? '<div class="alert-check"><strong>Всегда проверять:</strong> ' + ALWAYS_CHECK + '</div>'
          : '');

      window._currentChecklist = data;
    }

    function copyChecklist() {
      const data = window._currentChecklist;
      if (!data) return;

      let text = 'ПАМЯТКА ПО ДОКУМЕНТАМ\n(' + data.titleBadge + ')\n\n';
      data.sections.forEach(sec => {
        text += '▪ ' + sec.title.toUpperCase() + ':\n';
        sec.items.forEach(i => { text += '  — ' + i + '\n'; });
        text += '\n';
      });
      if (data.important.length) {
        text += 'ВАЖНО:\n';
        data.important.forEach(i => { text += '  • ' + i + '\n'; });
        text += '\n';
      }
      if (data.notes.length) {
        text += 'УТОЧНЕНИЯ:\n';
        data.notes.forEach(i => {
          const clean = i.replace(/<br\s*\/?>/gi, '\n    ').replace(/<[^>]+>/g, '');
          text += '  • ' + clean + '\n';
        });
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopiedState);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showCopiedState();
      }
    }

    function showCopiedState() {
      const btn = document.getElementById('copyBtn');
      const old = btn.innerText;
      btn.innerText = '✓ Скопировано!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerText = old;
        btn.classList.remove('copied');
      }, 2000);
    }

    renderQuestion('payment');
  </script>
</body>
